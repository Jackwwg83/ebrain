---
name: Ebrain CI

'on':
  pull_request:
    branches: [main, master, ebrain-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run verify

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Helm
        run: sudo snap install helm --classic
      - name: Helm lint
        run: |
          helm lint deploy/dev/helm \
            --set 'networkPolicy.httpsEgressCidrs[0]=203.0.113.0/24'
      - name: Helm fail-fast without SaaS egress CIDRs
        run: |
          if helm template ebrain-dev deploy/dev/helm \
            --values deploy/dev/helm/values.dev.yaml; then
            echo "helm template unexpectedly passed without HTTPS egress CIDRs"
            exit 1
          fi
      - name: Helm template
        run: |
          helm template ebrain-dev deploy/dev/helm \
            --values deploy/dev/helm/values.dev.yaml \
            --set 'networkPolicy.httpsEgressCidrs[0]=203.0.113.0/24' \
            > /tmp/ebrain-dev-rendered.yaml
      - name: Parse rendered Kubernetes YAML
        run: |
          ruby -e "
            require 'yaml'
            YAML.load_stream(File.read('/tmp/ebrain-dev-rendered.yaml'))
            puts 'rendered yaml ok'
          "

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Validate GitHub Actions workflows
        run: |
          ~/go/bin/actionlint \
            .github/workflows/ci.yml \
            .github/workflows/dev-deploy.yml

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Install Helm
        run: sudo snap install helm --classic
      - name: Render Helm chart
        run: |
          helm template ebrain-dev deploy/dev/helm \
            --values deploy/dev/helm/values.dev.yaml \
            --set 'networkPolicy.httpsEgressCidrs[0]=203.0.113.0/24' \
            > /tmp/ebrain-dev-rendered.yaml
      - name: Validate YAML syntax
        run: |
          if command -v yamllint >/dev/null 2>&1; then
            yamllint \
              deploy/dev/helm/values.dev.yaml \
              /tmp/ebrain-dev-rendered.yaml
          else
            ruby -e "
              require 'yaml'
              YAML.load_file('deploy/dev/helm/values.dev.yaml')
              YAML.load_stream(File.read('/tmp/ebrain-dev-rendered.yaml'))
              puts 'yaml syntax ok'
            "
          fi
