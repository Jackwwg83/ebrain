apiVersion: v1
kind: Service
metadata:
  name: {{ include "ebrain.componentName" (dict "root" . "component" "admin-spa") }}
  labels:
    {{- include "ebrain.componentLabels" (dict "root" . "component" "admin-spa") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ebrain.selectorLabels" (dict "root" . "component" "admin-spa") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.services.adminSpa.port }}
      targetPort: http
      protocol: TCP
