{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.postgres.name }}
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: {{ .Values.secrets.postgres.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.postgres.databaseUrlKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.databaseUrl | quote }}
    - secretKey: {{ .Values.secrets.postgres.hostKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.postgresHost | quote }}
    - secretKey: {{ .Values.secrets.postgres.passwordKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.postgresPassword | quote }}
{{- end }}
