{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.llm.name }}
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore }}
    kind: SecretStore
  target:
    name: {{ .Values.secrets.llm.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.llm.anthropicApiKey }}
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKeys.anthropicApiKey | quote }}
{{- end }}
