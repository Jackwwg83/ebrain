apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebrain-brain-repo
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- range .Values.persistence.accessModes }}
    - {{ . }}
    {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  storageClassName: {{ .Values.persistence.storageClassName }}
