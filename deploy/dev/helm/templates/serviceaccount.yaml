apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
imagePullSecrets:
  - name: {{ .Values.imagePullSecret.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-api-secret-reader
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-api-secret-reader
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-api-secret-reader
