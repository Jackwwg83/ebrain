apiVersion: v1
kind: Service
metadata:
  name: mcp-api
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ebrain.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
