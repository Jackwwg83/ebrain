apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ebrain-runtime
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.externalSecrets.runtime.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: EBRAIN_SECRETS_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.ebrainSecretsKeyRemoteKey }}
    - secretKey: GBRAIN_ADMIN_BOOTSTRAP_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.adminBootstrapTokenRemoteKey }}
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.openaiApiKeyRemoteKey }}
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.anthropicApiKeyRemoteKey }}
    - secretKey: DASHSCOPE_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.runtime.dashscopeApiKeyRemoteKey }}
