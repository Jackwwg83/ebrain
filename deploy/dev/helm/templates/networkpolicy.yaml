{{- if .Values.networkPolicy.enabled }}
{{- if eq (len .Values.networkPolicy.httpsEgressCidrs) 0 }}
{{- fail "networkPolicy.httpsEgressCidrs is empty. Set company-approved SaaS egress CIDRs in values.dev.yaml or --set before deploy." }}
{{- end }}
{{- range $i, $rawCidr := .Values.networkPolicy.httpsEgressCidrs }}
{{- $cidr := (toString $rawCidr | trim) }}
{{- if not (regexMatch "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]{1,3}$" $cidr) }}
{{- fail (printf "networkPolicy.httpsEgressCidrs[%d] is invalid: %q. Must be a non-empty IPv4 CIDR like 10.0.0.0/8." $i $cidr) }}
{{- end }}
{{- $parts := splitList "/" $cidr }}
{{- $ip := index $parts 0 }}
{{- $maskStr := index $parts 1 }}
{{- $mask := int (atoi $maskStr) }}
{{- if or (lt $mask 0) (gt $mask 32) }}
{{- fail (printf "networkPolicy.httpsEgressCidrs[%d] = %q has invalid mask /%s. Mask must be 0..32." $i $cidr $maskStr) }}
{{- end }}
{{- range $octIdx, $octStr := splitList "." $ip }}
{{- $oct := int (atoi $octStr) }}
{{- if or (lt $oct 0) (gt $oct 255) }}
{{- fail (printf "networkPolicy.httpsEgressCidrs[%d] = %q has invalid octet %d (= %s). Each octet must be 0..255." $i $cidr $octIdx $octStr) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-api-restricted-egress
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ebrain.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.rds.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.rds.port }}
    {{- range .Values.networkPolicy.httpsEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | toString | trim }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
