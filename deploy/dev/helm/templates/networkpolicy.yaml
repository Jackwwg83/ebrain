{{- if .Values.networkPolicy.enabled }}
{{- if eq (len .Values.networkPolicy.httpsEgressCidrs) 0 }}
{{- fail "networkPolicy.httpsEgressCidrs is empty. Set company-approved SaaS egress CIDRs in values.dev.yaml or --set before deploy." }}
{{- end }}
{{- range $i, $cidr := .Values.networkPolicy.httpsEgressCidrs }}
{{- $trimmedCidr := (toString $cidr | trim) }}
{{- if not (regexMatch "^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}/[0-9]{1,2}$" $trimmedCidr) }}
{{- fail (printf "networkPolicy.httpsEgressCidrs[%d] is invalid: %q. Must be a non-empty IPv4 CIDR like 10.0.0.0/8." $i $cidr) }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-api-restricted-egress
  labels:
    {{- include "ebrain.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ebrain.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.rds.cidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.rds.port }}
    {{- range .Values.networkPolicy.httpsEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | toString | trim }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
